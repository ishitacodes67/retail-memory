[project]
name = "retail-memory"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Ignore line length in files with HTML/CSS or long prompt strings
"app.py" = ["E501"]
"src/retail_memory/agent/prompts.py" = ["E501"]